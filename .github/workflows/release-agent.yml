name: release-hub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: npm run test:all
      - run: docker build -f deploy/Dockerfile .
      - name: Note
        run: echo 'hub release gates passed; agent binaries are released from novoard-agent'

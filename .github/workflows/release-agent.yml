name: release-agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Contract copy gate
        run: node scripts/check-contract-copy.mjs
      - name: Note
        run: echo "hub repo release: contract gate only; agent binaries live in novoard-agent repo"

# nginx 子目录反代片段（PRD-2 F5 同机多服务形态；hub 仅 127.0.0.1:8787，不暴露公网端口）
# 用法：include 到 server {} 块，或按需改子路径
location /novoard/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # WS 隧道升级（契约 §4）
    proxy_set_header Connection "upgrade";       # 隧道长连接
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;                     # agent.ping 25s + hub 超时 60s，余量充足
    proxy_send_timeout 300s;
    client_max_body_size 8m;                     # artifact 5MB 上限 + 信封开销（契约 §7）
}

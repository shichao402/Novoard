# Novoard · intranet-weekly（内网服务器 · 周报 agent）target 定义
# 契约 §1；周报类 target 定时归 agent 本地 cron（schedule 字段，ADR-0003 调度归属）
# 通知上交 hub 扇出（notify: always）；artifact 上 hub 存证（契约 §7）
# 检查逻辑来自 autoworks 收编（research 0004 姿势二：保留进程做运行时，命令化、幂等、退出码带语义）

targets:
  weekly-report:
    title: 生成内网周报
    schedule: "0 9 * * 1"
    template: run-weekly-report
    vars:
      repoDir: /srv/autoworks
      outDir: /srv/autoworks/out
    expose: a2a
    audit: full
    requiresApproval: false
    notify: always
